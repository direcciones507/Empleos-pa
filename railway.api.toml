[build]
builder = "RAILPACK"
buildCommand = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @empleos-pa/api build"
watchPatterns = ["/apps/api/**", "/package.json", "/pnpm-workspace.yaml", "/pnpm-lock.yaml", "/railway.api.toml"]

[deploy]
startCommand = "node apps/api/dist/server.js"
preDeployCommand = ["pnpm --filter @empleos-pa/api migrate"]
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
