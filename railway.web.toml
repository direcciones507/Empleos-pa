[build]
builder = "RAILPACK"
buildCommand = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @empleos-pa/web build"
watchPatterns = ["/apps/web/**", "/package.json", "/pnpm-workspace.yaml", "/pnpm-lock.yaml", "/railway.web.toml"]

[deploy]
startCommand = "pnpm --filter @empleos-pa/web start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
