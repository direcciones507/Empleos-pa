name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pr50
          POSTGRES_PASSWORD: isolated-fixture-only
          POSTGRES_DB: empleos_pr50
        ports:
          - 55450:5432
        options: >-
          --health-cmd "pg_isready -U pr50 -d empleos_pr50"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Contract tests
        run: node --test tests/*.test.mjs

      - name: PostgreSQL integration
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://pr50:isolated-fixture-only@127.0.0.1:55450/empleos_pr50
        run: node --import tsx src/structured-matching-postgres.integration.ts

      - name: Build
        run: pnpm build
