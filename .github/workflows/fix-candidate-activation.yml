name: Apply candidate activation fix
'on':
  push:
    branches:
      - fix/candidate-submit-activation
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candidate-submit-activation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_candidate_activation.py
      - run: rm scripts/fix_candidate_activation.py .github/workflows/fix-candidate-activation.yml .candidate-fix-trigger
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix candidate activation and profile retirement"
          git push origin HEAD:fix/candidate-submit-activation
